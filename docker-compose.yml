version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: platform/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Persist SQLite DB and LanceDB outside the container
      - ./data:/data
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DB_PATH=/data/platform.db
      - LANCEDB_PATH=/data/platform_lancedb
      - SOURCES_DIR=/data/platform_sources
    restart: unless-stopped
